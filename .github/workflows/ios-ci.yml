name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Static checks and Xcode build
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: App Store static readiness checks
        run: bash scripts/validate_app_store_ready.sh

      - name: Build Debug for iOS Simulator
        run: |
          xcodebuild build \
            -project mdreader.xcodeproj \
            -scheme mdreader \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build test bundle for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -project mdreader.xcodeproj \
            -scheme mdreader \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release for iPhone and iPad
        run: |
          xcodebuild build \
            -project mdreader.xcodeproj \
            -scheme mdreader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run XCTest on available iPhone Simulator
        timeout-minutes: 8
        run: bash scripts/run_xcode_tests_on_available_simulator.sh

      - name: Upload XCTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xctest-diagnostics
          path: |
            TestResults.xcresult
            DerivedData/Logs/Test
